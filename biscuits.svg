<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="#f5e6d3"/>
  
  <!-- Biscuit 1 - Top Left -->
  <g transform="translate(80, 80)">
    <!-- Main biscuit body -->
    <circle cx="0" cy="0" r="45" fill="#d4a574"/>
    <!-- Shadow/darker edge -->
    <circle cx="0" cy="0" r="45" fill="none" stroke="#8b6f47" stroke-width="2" opacity="0.6"/>
    <!-- Texture dots -->
    <circle cx="-15" cy="-15" r="3" fill="#c99563" opacity="0.7"/>
    <circle cx="10" cy="-20" r="2.5" fill="#c99563" opacity="0.7"/>
    <circle cx="20" cy="-5" r="3" fill="#c99563" opacity="0.7"/>
    <circle cx="15" cy="15" r="2.5" fill="#c99563" opacity="0.7"/>
    <circle cx="-5" cy="20" r="3" fill="#c99563" opacity="0.7"/>
    <circle cx="-20" cy="10" r="2.5" fill="#c99563" opacity="0.7"/>
    <circle cx="-10" cy="0" r="2" fill="#c99563" opacity="0.7"/>
    <!-- Crumb texture -->
    <ellipse cx="-8" cy="-10" rx="2" ry="1.5" fill="#8b6f47" opacity="0.4"/>
    <ellipse cx="12" cy="5" rx="1.5" ry="2" fill="#8b6f47" opacity="0.4"/>
  </g>
  
  <!-- Biscuit 2 - Top Right -->
  <g transform="translate(280, 100)">
    <!-- Main biscuit body -->
    <circle cx="0" cy="0" r="40" fill="#e8b896"/>
    <!-- Shadow/darker edge -->
    <circle cx="0" cy="0" r="40" fill="none" stroke="#9d7e54" stroke-width="2" opacity="0.6"/>
    <!-- Texture dots -->
    <circle cx="-12" cy="-18" r="2.5" fill="#d4a574" opacity="0.7"/>
    <circle cx="15" cy="-15" r="2" fill="#d4a574" opacity="0.7"/>
    <circle cx="18" cy="8" r="2.5" fill="#d4a574" opacity="0.7"/>
    <circle cx="8" cy="18" r="2" fill="#d4a574" opacity="0.7"/>
    <circle cx="-15" cy="12" r="2.5" fill="#d4a574" opacity="0.7"/>
    <circle cx="-5" cy="-8" r="2" fill="#d4a574" opacity="0.7"/>
    <!-- Crumb texture -->
    <ellipse cx="5" cy="-12" rx="2" ry="1.5" fill="#9d7e54" opacity="0.4"/>
  </g>
  
  <!-- Biscuit 3 - Center (slightly rotated) -->
  <g transform="translate(200, 180) rotate(15)">
    <!-- Main biscuit body -->
    <circle cx="0" cy="0" r="48" fill="#d9a876"/>
    <!-- Shadow/darker edge -->
    <circle cx="0" cy="0" r="48" fill="none" stroke="#8b6f47" stroke-width="2" opacity="0.6"/>
    <!-- Texture dots -->
    <circle cx="-18" cy="-20" r="3" fill="#c99563" opacity="0.7"/>
    <circle cx="12" cy="-25" r="2.5" fill="#c99563" opacity="0.7"/>
    <circle cx="25" cy="-8" r="3" fill="#c99563" opacity="0.7"/>
    <circle cx="20" cy="18" r="2.5" fill="#c99563" opacity="0.7"/>
    <circle cx="-8" cy="25" r="3" fill="#c99563" opacity="0.7"/>
    <circle cx="-25" cy="15" r="2.5" fill="#c99563" opacity="0.7"/>
    <circle cx="-12" cy="-5" r="2" fill="#c99563" opacity="0.7"/>
    <circle cx="5" cy="12" r="2" fill="#c99563" opacity="0.7"/>
    <!-- Crumb texture -->
    <ellipse cx="-10" cy="-15" rx="2.5" ry="1.5" fill="#8b6f47" opacity="0.4"/>
    <ellipse cx="15" cy="8" rx="2" ry="2" fill="#8b6f47" opacity="0.4"/>
  </g>
  
  <!-- Biscuit 4 - Bottom Left -->
  <g transform="translate(120, 240) rotate(-20)">
    <!-- Main biscuit body -->
    <circle cx="0" cy="0" r="38" fill="#e0b68a"/>
    <!-- Shadow/darker edge -->
    <circle cx="0" cy="0" r="38" fill="none" stroke="#9d7e54" stroke-width="2" opacity="0.6"/>
    <!-- Texture dots -->
    <circle cx="-14" cy="-16" r="2.5" fill="#d4a574" opacity="0.7"/>
    <circle cx="14" cy="-14" r="2" fill="#d4a574" opacity="0.7"/>
    <circle cx="16" cy="10" r="2.5" fill="#d4a574" opacity="0.7"/>
    <circle cx="6" cy="16" r="2" fill="#d4a574" opacity="0.7"/>
    <circle cx="-12" cy="12" r="2.5" fill="#d4a574" opacity="0.7"/>
    <!-- Crumb texture -->
    <ellipse cx="4" cy="-10" rx="2" ry="1.5" fill="#9d7e54" opacity="0.4"/>
  </g>
  
  <!-- Biscuit 5 - Bottom Right -->
  <g transform="translate(300, 230) rotate(25)">
    <!-- Main biscuit body -->
    <circle cx="0" cy="0" r="42" fill="#d4a574"/>
    <!-- Shadow/darker edge -->
    <circle cx="0" cy="0" r="42" fill="none" stroke="#8b6f47" stroke-width="2" opacity="0.6"/>
    <!-- Texture dots -->
    <circle cx="-16" cy="-18" r="2.5" fill="#c99563" opacity="0.7"/>
    <circle cx="16" cy="-16" r="2.5" fill="#c99563" opacity="0.7"/>
    <circle cx="18" cy="12" r="2.5" fill="#c99563" opacity="0.7"/>
    <circle cx="8" cy="18" r="2" fill="#c99563" opacity="0.7"/>
    <circle cx="-14" cy="14" r="2.5" fill="#c99563" opacity="0.7"/>
    <circle cx="-6" cy="-8" r="2" fill="#c99563" opacity="0.7"/>
    <!-- Crumb texture -->
    <ellipse cx="-8" cy="-12" rx="2" ry="1.5" fill="#8b6f47" opacity="0.4"/>
    <ellipse cx="12" cy="6" rx="2" ry="1.5" fill="#8b6f47" opacity="0.4"/>
  </g>
</svg>