<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Calculator</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #1f2937, #111827);
      color: #f9fafb;
    }

    .calculator {
      width: 320px;
      background: #0f172a;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.35);
    }

    .display {
      width: 100%;
      height: 80px;
      background: #111827;
      border: 1px solid #374151;
      border-radius: 12px;
      margin-bottom: 16px;
      padding: 12px 16px;
      font-size: 2rem;
      text-align: right;
      overflow: hidden;
      white-space: nowrap;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 18px 10px;
      font-size: 1.2rem;
      cursor: pointer;
      transition: transform 0.08s ease, opacity 0.2s ease;
      background: #374151;
      color: white;
    }

    button:hover {
      opacity: 0.95;
    }

    button:active {
      transform: scale(0.98);
    }

    .operator {
      background: #f59e0b;
      color: #111827;
      font-weight: bold;
    }

    .action {
      background: #4b5563;
    }

    .equals {
      background: #10b981;
      color: white;
      grid-column: span 2;
    }
  </style>
</head>
<body>
  <div class="calculator">
    <div id="display" class="display">0</div>

    <div class="buttons">
      <button class="action" data-action="clear">C</button>
      <button class="action" data-action="delete">DEL</button>
      <button class="operator" data-value="/">÷</button>
      <button class="operator" data-value="*">×</button>

      <button data-value="7">7</button>
      <button data-value="8">8</button>
      <button data-value="9">9</button>
      <button class="operator" data-value="-">−</button>

      <button data-value="4">4</button>
      <button data-value="5">5</button>
      <button data-value="6">6</button>
      <button class="operator" data-value="+">+</button>

      <button data-value="1">1</button>
      <button data-value="2">2</button>
      <button data-value="3">3</button>
      <button class="equals" data-action="equals">=</button>

      <button data-value="0" style="grid-column: span 2;">0</button>
      <button data-value=".">.</button>
    </div>
  </div>

  <script>
    const display = document.getElementById('display');
    let currentInput = '0';
    let previousValue = null;
    let operator = null;
    let shouldResetDisplay = false;

    function updateDisplay() {
      display.textContent = currentInput;
    }

    function appendValue(value) {
      if (shouldResetDisplay) {
        currentInput = value === '.' ? '0.' : value;
        shouldResetDisplay = false;
      } else {
        if (value === '.' && currentInput.includes('.')) return;
        currentInput = currentInput === '0' && value !== '.' ? value : currentInput + value;
      }
      updateDisplay();
    }

    function setOperator(nextOperator) {
      const value = parseFloat(currentInput);

      if (previousValue !== null && operator !== null && !shouldResetDisplay) {
        calculate();
      }

      previousValue = value;
      operator = nextOperator;
      shouldResetDisplay = true;
    }

    function calculate() {
      if (previousValue === null || operator === null) return;

      const current = parseFloat(currentInput);
      let result;

      switch (operator) {
        case '+':
          result = previousValue + current;
          break;
        case '-':
          result = previousValue - current;
          break;
        case '*':
          result = previousValue * current;
          break;
        case '/':
          result = current === 0 ? 'Error' : previousValue / current;
          break;
        default:
          return;
      }

      currentInput = String(result);
      previousValue = null;
      operator = null;
      shouldResetDisplay = true;
      updateDisplay();
    }

    function clearAll() {
      currentInput = '0';
      previousValue = null;
      operator = null;
      shouldResetDisplay = false;
      updateDisplay();
    }

    function deleteLast() {
      if (shouldResetDisplay) {
        currentInput = '0';
        shouldResetDisplay = false;
      } else {
        currentInput = currentInput.length <= 1 ? '0' : currentInput.slice(0, -1);
      }
      updateDisplay();
    }

    document.querySelectorAll('button').forEach(button => {
      button.addEventListener('click', () => {
        const value = button.dataset.value;
        const action = button.dataset.action;

        if (value !== undefined) {
          appendValue(value);
          return;
        }

        if (action === 'clear') {
          clearAll();
        } else if (action === 'delete') {
          deleteLast();
        } else if (action === 'equals') {
          calculate();
        }
      });
    });

    document.querySelectorAll('.operator').forEach(button => {
      button.addEventListener('click', () => {
        setOperator(button.dataset.value);
      });
    });

    document.addEventListener('keydown', (event) => {
      const key = event.key;

      if (/^[0-9]$/.test(key)) appendValue(key);
      if (key === '.') appendValue('.');
      if (['+', '-', '*', '/'].includes(key)) setOperator(key);
      if (key === 'Enter' || key === '=') calculate();
      if (key === 'Backspace') deleteLast();
      if (key === 'Escape') clearAll();
    });

    updateDisplay();
  </script>
</body>
</html>
